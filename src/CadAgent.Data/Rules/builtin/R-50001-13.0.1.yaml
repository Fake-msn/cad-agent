  excerpt: "图层名称宜使用汉字、英文字母、数字和连字符'-'的组合，但汉字与英文字母不得混用；在同一工程中，应使用统一的图层命名格式，图层名称应自始至终保持不变，且不应同时使用汉字和英文字母的命名格式。"
